name: CI

on:
  push:
    branches: ["main", "prototype-v0.1"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run synthetic-data tests
        run: python -m pytest -q

      - name: Generate demo data
        run: python synthetic_data/generate_demo_data.py --n 50 --seed 123

      - name: Compile application
        run: python -m py_compile app/app.py synthetic_data/generate_demo_data.py

      - name: Smoke-test Streamlit app
        run: |
          streamlit run app/app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          APP_PID=$!
          sleep 8
          curl --fail http://127.0.0.1:8501/_stcore/health
          kill $APP_PID
