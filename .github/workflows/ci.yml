name: CI

on:
  push:
    branches: ["main", "prototype-v0.1"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run synthetic-data tests
        run: pytest -q

      - name: Generate demo data
        run: python synthetic_data/generate_demo_data.py --n 50 --seed 123

      - name: Compile application
        run: python -m py_compile app/app.py synthetic_data/generate_demo_data.py
